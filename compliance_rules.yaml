# TRACE.ai compliance rules -- hot-reloadable via watchdog.
# Edit and save; changes take effect within ~5 seconds (no restart needed).
# References:
#   - PMLA 2002 + PMLA (Amendment) Act 2012
#   - RBI Master Direction on KYC, 2016 (updated 2024)
#   - FIU-IND STR Filing Manual v3.2
#
# Rule format:
#   id: RULE_ID
#   description: Human-readable description
#   field: transaction field to check  (amount | kyc_risk | channel | dormant_days | kyc_risk_score)
#   op: gt | lt | gte | lte | eq | in
#   value: comparison value
#   action: FLAG | ALERT | FREEZE
#   severity: HIGH | MEDIUM | LOW

rules:
  - id: HIGH_VALUE_SINGLE_TXN
    description: "Single transaction >= Rs 10L -- mandatory CTR per RBI guidelines"
    field: amount
    op: gte
    value: 1000000
    action: FLAG
    severity: HIGH

  - id: STRUCTURING_THRESHOLD
    description: "Transaction 80-99% of Rs 10L CTR threshold (structuring indicator)"
    field: amount
    op: gte
    value: 800000
    action: ALERT
    severity: HIGH

  - id: KYC_HIGH_RISK_ACCOUNT
    description: "Account classified as HIGH KYC risk -- enhanced due diligence required"
    field: kyc_risk
    op: eq
    value: HIGH
    action: ALERT
    severity: MEDIUM

  - id: DORMANT_HIGH_VALUE
    description: "Dormant account (>=90 days) with high-value transaction"
    field: dormant_days
    op: gte
    value: 90
    action: FLAG
    severity: MEDIUM

  - id: ATM_LARGE_CASH
    description: "Large ATM withdrawal -- potential smurfing indicator"
    field: channel
    op: eq
    value: ATM
    action: ALERT
    severity: LOW

  - id: RTGS_HIGH_AMOUNT
    description: "RTGS transaction >= Rs 5L -- STR consideration threshold"
    field: amount
    op: gte
    value: 500000
    action: FLAG
    severity: LOW
