[project]
name = "trace-ai"
version = "0.1.0"
description = "TRACE.ai — Transaction Risk Analysis & Compliance Engine. iDEA Hackathon 2.0 PS3."
authors = [{ name = "Team NamoFans" }]
requires-python = ">=3.11"
license = { text = "MIT" }
readme = "README.md"

dependencies = [
    # Graph + ML
    "networkx>=3.2",
    "torch>=2.2",
    "torch-geometric>=2.5",
    "river>=0.21",
    "scikit-learn>=1.4",
    "shap>=0.45",
    "rapidfuzz>=3.6",
    "numpy>=1.26",
    "pandas>=2.2",

    # Backend
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "websockets>=12.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "watchdog>=4.0",

    # Intelligence
    "litellm>=1.30",
    "reportlab>=4.1",

    # Data generation
    "faker>=24.0",

    # Utilities
    "python-dotenv>=1.0",
    "loguru>=0.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
    "mypy>=1.9",
    "pre-commit>=3.6",
    "ipython>=8.20",
    "jupyterlab>=4.1",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
asyncio_mode = "auto"
