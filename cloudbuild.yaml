steps:
  # Step 1: Build the Docker image
  # Rust compilation (~10 min) + npm build + seed_demo (~3 min)
  - name: "gcr.io/cloud-builders/docker"
    id: build
    args:
      - build
      - -t
      - gcr.io/agrowise-192e3/trace-ai:latest
      - .
    timeout: "1200s"

  # Step 2: Push to Container Registry
  - name: "gcr.io/cloud-builders/docker"
    id: push
    args:
      - push
      - gcr.io/agrowise-192e3/trace-ai:latest
    waitFor:
      - build

  # Step 3: Deploy to Cloud Run
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: deploy
    entrypoint: gcloud
    args:
      - run
      - deploy
      - trace-ai
      - --image=gcr.io/agrowise-192e3/trace-ai:latest
      - --platform=managed
      - --region=us-central1
      - --allow-unauthenticated
      - --memory=2Gi
      - --cpu=2
      - --timeout=300
      - --set-env-vars=PYTHONUNBUFFERED=1
      - --project=agrowise-192e3
    waitFor:
      - push

images:
  - gcr.io/agrowise-192e3/trace-ai:latest

options:
  logging: CLOUD_LOGGING_ONLY

# 30-minute overall timeout (Rust compile is slow)
timeout: "1800s"
